services:
  sonde:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonde
    restart: unless-stopped
    # The reference Compose deployment is a loopback-only HTTP quick start. The container must
    # listen on 0.0.0.0, so Sonde cannot infer the host-side 127.0.0.1 publish and would otherwise
    # force Secure cookies that browsers refuse to store over http://127.0.0.1.
    #
    # SONDE_ALLOW_INSECURE_COOKIES therefore defaults to 1 here only because the published port is
    # pinned to host loopback. For a TLS reverse proxy set SONDE_ALLOW_INSECURE_COOKIES=0 (or use
    # the image directly without the opt-out). Never combine the opt-out with a non-loopback host
    # publish.
    #
    # First-run initialization requires a one-time setup token: set SONDE_SETUP_TOKEN, or read
    # the token Sonde generates and logs at startup. Never leave port 8080 reachable from the
    # internet while the instance is still uninstalled.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SONDE_BIND=0.0.0.0:8080
      - SONDE_DATA_DIR=/app/data
      - SONDE_ALLOW_INSECURE_COOKIES=${SONDE_ALLOW_INSECURE_COOKIES:-1}
      - RUST_LOG=sonde=info,actix_web=info
    volumes:
      - sonde_data:/app/data
    # The process binds an unprivileged port and writes persistent/runtime staging data only to
    # /app/data. /tmp is a small scratch tmpfs and is not used for large backup restore staging,
    # so the service needs no Linux capabilities and no privilege escalation.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

volumes:
  sonde_data:
    driver: local
