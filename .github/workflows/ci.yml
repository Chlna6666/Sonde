name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust 1.95 quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

  sdk:
    name: Rust SDK quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml --all --check

      - name: Check
        run: cargo check --manifest-path sdk/rust/Cargo.toml --all-targets --locked

      - name: Clippy
        run: cargo clippy --manifest-path sdk/rust/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked

  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build


  production-smoke:
    name: Production image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONDE_E2E_URL: http://127.0.0.1:8091
      SONDE_E2E_SETUP_TOKEN: ci-setup-token-2026-sonde
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag "sonde-ci:${GITHUB_SHA}" .

      - name: Start hardened container
        run: |
          docker volume create sonde-ci-data
          docker run --detach --name sonde-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8091:8080 \
            --volume sonde-ci-data:/app/data \
            --env SONDE_SETUP_TOKEN="$SONDE_E2E_SETUP_TOKEN" \
            "sonde-ci:${GITHUB_SHA}"

      - name: Wait for live endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$SONDE_E2E_URL/health/live"; then
              exit 0
            fi
            sleep 1
          done
          docker logs sonde-ci
          exit 1

      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r tests/requirements-e2e.txt
          python3 -m playwright install --with-deps chromium

      - name: Browser smoke
        run: python3 tests/e2e_smoke.py

      - name: Container logs
        if: failure()
        run: docker logs sonde-ci

      - name: Cleanup
        if: always()
        run: |
          docker rm --force sonde-ci 2>/dev/null || true
          docker volume rm sonde-ci-data 2>/dev/null || true

  security-rust:
    name: Dependency audit (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

  security-frontend:
    name: Dependency audit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Audit frontend dependencies
        working-directory: web
        run: pnpm audit --audit-level=high
