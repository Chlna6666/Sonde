version: 2

# Keeps the dependency surface current instead of leaving it to ad-hoc manual updates.
# Grouped minor/patch bumps arrive as one PR per ecosystem; major bumps stay separate so they
# can be reviewed against the MSRV (Rust 1.95), the Rust 2024 edition, and the pinned
# Node/pnpm toolchain before landing.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions are pinned to commit SHAs in .github/workflows; Dependabot understands the
  # `# vX` comments and keeps those pins moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"

  # Base images are tagged rather than digest-pinned so this ecosystem can advance them;
  # rebuild the release image after each bump to pick up OS package fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
