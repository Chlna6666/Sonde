[package]
name = "sonde"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
description = "A self-hosted telemetry analytics platform for multiple applications"
license = "MIT"
repository = "https://github.com/Chlna6666/Sonde"
readme = "README.md"
keywords = ["telemetry", "analytics", "actix-web", "self-hosted"]
categories = ["web-programming::http-server"]

[dependencies]
actix-web = "4.11"
argon2 = "0.5"
async-stream = "0.3"
awc = { version = "3", features = ["rustls-0_23"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
mime_guess = "2"
# 0.1.52+ defaults to Microsoft mimalloc v3. Do not enable the `v2` feature.
mimalloc = { version = "0.1.52", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8.7", features = ["compression"] }
sea-orm = { version = "2.0.0", features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-json", "with-chrono", "macros"] }
sea-orm-migration = { version = "2.0.0", features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
actix-http = "3"
criterion = "0.5"

[[bench]]
name = "hot_path"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
